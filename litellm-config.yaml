  - model_name: "openai.gpt-5.6-sol"
    litellm_params:
      model: "openai/openai.gpt-5.6-sol"
      api_base: "http://127.0.0.1:4010"
      api_key: "dummy"
      extra_headers:
        OpenAI-Project: os.environ/MANTLE_PROJECT_ID
      drop_params: true
  # Claude Haiku & Fable: Messages API via mantle-proxy
  - model_name: "bedrock/anthropic.claude-haiku-4-5"
    litellm_params:
      model: "anthropic/anthropic.claude-haiku-4-5"
      api_base: "http://127.0.0.1:4010/anthropic"
      api_key: "sk-not-used"
      extra_headers:
        anthropic-workspace: os.environ/MANTLE_PROJECT_ID
      drop_params: true
  - model_name: "mantle/anthropic.claude-fable-5"
    litellm_params:
      model: "anthropic/anthropic.claude-fable-5"
