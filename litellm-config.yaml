      api_key: "dummy"
      extra_headers:
        OpenAI-Project: os.environ/MANTLE_PROJECT_ID
      drop_params: true
  # GPT-5.6-sol: Responses API via mantle-proxy
  - model_name: "bedrock/openai.gpt-5.6-sol"
