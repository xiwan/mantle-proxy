model_list:
  # --- Standard Bedrock Converse (no Mantle Project cost tracking) ---
  - model_name: "bedrock/moonshotai.kimi-k2.5"
    litellm_params:
      model: "bedrock/moonshotai.kimi-k2.5"
      aws_region_name: "us-east-1"
  - model_name: "bedrock/qwen.qwen3-coder-next"
    litellm_params:
      model: "bedrock/qwen.qwen3-coder-next"
      aws_region_name: "us-east-1"
  - model_name: "bedrock/anthropic.claude-sonnet-5"
    litellm_params:
      model: "bedrock/us.anthropic.claude-sonnet-5"
      aws_region_name: "us-west-2"
      drop_params: true
      additional_drop_params: ["top_p"]
      cache_control_injection_points:
        - location: message
          role: system
          control:
            type: "default"
            ttl: "1h"
        - location: message
          index: -1
          control:
            type: "default"
            ttl: "1h"
        - location: message
          index: -2
          control:
            type: "default"
            ttl: "1h"
        - location: message
          index: -3
          control:
            type: "default"
            ttl: "1h"

  - model_name: "bedrock/anthropic.claude-sonnet-4-6"
