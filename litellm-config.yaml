  # --- Mantle with Project cost tracking (project id from MANTLE_PROJECT_ID env) ---
  # GPT-5.5: Responses API via mantle-proxy
  - model_name: "bedrock/openai.gpt-5.5"
    litellm_params:
      model: "openai/openai.gpt-5.5"
      api_base: "http://127.0.0.1:4010"
      api_key: "dummy"
      extra_headers:
        OpenAI-Project: os.environ/MANTLE_PROJECT_ID
      drop_params: true
  - model_name: "gpt-5.5"
    litellm_params:
      model: "openai/openai.gpt-5.5"
      api_base: "http://127.0.0.1:4010"
      api_key: "dummy"
      extra_headers:
        OpenAI-Project: os.environ/MANTLE_PROJECT_ID
      drop_params: true
  - model_name: "openai.gpt-5.5"
    litellm_params:
