[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mantle-sigv4-proxy"
version = "0.1.0"
description = "Local SigV4 signing proxy for Bedrock Mantle OpenAI-compatible endpoints"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "aiohttp>=3.9,<4",
    "botocore>=1.34,<2",
]

[project.optional-dependencies]
litellm = [
    "httpx>=0.27,<1",
    "litellm>=1.0",
]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
mantle-sigv4-proxy = "mantle_proxy.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
